name: fraudguard_dart
description: FraudGuard anti-fraud scoring dashboard and transaction stream simulator.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  decimal: 3.2.6
  file_picker: 13.3.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/history.csv
    - assets/data/transactions.csv
    - assets/data/expected-results.csv
    - assets/data/transactions_invalid.csv
    - assets/data/conformance/history.csv
    - assets/data/conformance/transactions.csv
    - assets/data/conformance/expected-results.csv
